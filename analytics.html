<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
<title>Analytics</title>

<style>
.analytics-box {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 30px;
}

.analytics-card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    padding: 25px;
    border-radius: 15px;
    width: 180px;
    text-align: center;
    color: white;
    transition: 0.3s;
}

.analytics-card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

.analytics-card h3 {
    margin-bottom: 10px;
}

.analytics-card p {
    font-size: 26px;
    font-weight: bold;
}
</style>

</head>

<body class="gradient">

<h2 style="text-align:center;">📊 Website Analytics</h2>

<div class="analytics-box">

    <div class="analytics-card">
        <h3>Total Items</h3>
        <p>{{ total }}</p>
    </div>

    <div class="analytics-card">
        <h3>Approved</h3>
        <p>{{ approved }}</p>
    </div>

    <div class="analytics-card">
        <h3>Pending</h3>
        <p>{{ pending }}</p>
    </div>

    <div class="analytics-card">
        <h3>Found</h3>
        <p>{{ found }}</p>
    </div>

</div>

<br><br>

<div style="text-align:center;">
    <a href="/dashboard"><button>⬅ Back to Dashboard</button></a>
</div>

</body>
</html>
